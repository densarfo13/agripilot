<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Farroway</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (Android status bar + PWA chrome) -->
    <meta name="theme-color" content="#0F172A" />

    <!-- Favicons & app icons \u2014 every brand asset resolves to
         the logo-premium.* family. The brand team supplied the
         premium logo as a 1080\u00D71080 JPG; the size variants
         below all share the same JPG (browsers downscale on
         render). When a vector SVG arrives, swap these to .svg
         and redeploy.
           logo-premium.jpg       \u2014 raster master + og:image
           logo-premium-1024.jpg  \u2014 PWA + Windows tile
           logo-premium-512.jpg   \u2014 PWA install + maskable
           logo-premium-192.jpg   \u2014 Android home-screen
           logo-premium-180.jpg   \u2014 iOS apple-touch-icon
           logo-premium.svg       \u2014 (future) vector master -->
    <link rel="icon" type="image/jpeg" href="/icons/logo-premium.jpg" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/icons/logo-premium-192.jpg" />
    <link rel="mask-icon" href="/icons/logo-premium.jpg" color="#0B1220" />

    <!-- Apple iOS PWA tags. The 180x180 .jpg is the canonical
         apple-touch-icon; the unsized fallback below picks the
         same file so older Safari versions get the same mark. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/logo-premium-180.jpg" />
    <link rel="apple-touch-icon" href="/icons/logo-premium-180.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Modern equivalent of the deprecated apple-* meta — silences
         Chrome's deprecation warning while keeping iOS PWA support. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- May 2026 immersive theme — status bar reads on the dark
         navy hero. Was 'default' which painted a light bar over
         dark content on iOS PWA installs. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Farroway" />

    <!-- Open Graph / Twitter share previews. When a Farroway
         link is pasted into chat or social feeds, the JPG is
         what partners and farmers see in the link card. -->
    <meta property="og:title" content="Farroway" />
    <meta property="og:description" content="Know what to do today. Grow better." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://farroway.app/" />
    <meta property="og:site_name" content="Farroway" />
    <meta property="og:image" content="/icons/logo-premium-1024.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Farroway" />
    <meta name="twitter:description" content="Know what to do today. Grow better." />
    <meta name="twitter:image" content="/icons/logo-premium-1024.jpg" />

    <!-- Mobile viewport — viewport-fit=cover lets the immersive
         hero bleed into the iPhone notch / home-indicator area
         when the status bar is black-translucent. Without this,
         iOS Safari paints a flat black band at the bottom on
         devices with a home indicator. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Hero preload removed: the realVisuals resolver picks from
         5 region packs + crop closeups + operator-uploaded photos,
         so the canonical fallback (africa-farm-atmosphere.jpeg) is
         rarely the actual chosen image. Preloading it produced two
         "preloaded but not used" warnings per page on most boots.
         The chosen hero loads via the rendered <img> tag with
         loading="eager" — fast enough without the preload nudge. -->

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Devanagari (Hindi) font — loaded via stylesheet so it's
         available immediately when html[lang="hi"] is set. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" />

    <!-- RC1 App Store metadata. /privacy and /terms routes are
         wired in App.jsx; these meta tags surface the URLs for
         App Store reviewers + browser extensions that auto-link. -->
    <link rel="privacy" href="https://farroway.app/privacy" />
    <meta name="privacy-policy" content="https://farroway.app/privacy" />
    <meta name="terms-of-service" content="https://farroway.app/terms" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Early extension-noise trap. The bundled installGlobalErrorFilter
         in src/lib/consoleFilter.js runs the same patterns, but module
         scripts are deferred — extensions that inject at document_start
         can fire unhandledrejection / error events BEFORE the bundle
         executes, leaking the noise to the console. This inline script
         runs synchronously at parse time so the listeners are armed
         before any extension content script can throw.

         Patterns kept short + load-bearing: tabs:outgoing.* (Chrome tab
         messaging), No Listener: tabs: (sibling shape), cornhusk +
         shared-service (third-party SDK), Failed to construct 'URL'
         (cornhusk URL-hook noise). Anything that doesn't match falls
         through to the regular console — real app errors are NEVER
         suppressed here. -->
    <script>
      (function () {
        var PATTERNS = [
          'tabs:outgoing',
          'tabs:incoming',
          'No Listener: tabs:',
          'message channel closed',
          'cornhusk',
          'shared-service',
          "Failed to construct 'URL'",
        ];
        function _matches(ev) {
          try {
            var msg = '';
            if (ev) {
              if (ev.reason && typeof ev.reason === 'object') {
                msg = (ev.reason.message || '') + ' ' + (ev.reason.stack || '');
              } else if (ev.reason != null) {
                msg = String(ev.reason);
              } else if (ev.error && typeof ev.error === 'object') {
                msg = (ev.error.message || '') + ' ' + (ev.error.stack || '');
              } else if (ev.message != null) {
                msg = String(ev.message);
              }
            }
            for (var i = 0; i < PATTERNS.length; i += 1) {
              if (msg.indexOf(PATTERNS[i]) >= 0) return true;
            }
          } catch (e) { /* never throw from filter */ }
          return false;
        }
        try {
          window.addEventListener('unhandledrejection', function (ev) {
            if (_matches(ev)) {
              try { ev.preventDefault(); } catch (e) {}
              try { ev.stopImmediatePropagation(); } catch (e) {}
            }
          }, true);
          window.addEventListener('error', function (ev) {
            if (_matches(ev)) {
              try { ev.preventDefault(); } catch (e) {}
              try { ev.stopImmediatePropagation(); } catch (e) {}
            }
          }, true);
        } catch (e) { /* never throw from setup */ }

        // Console-method wrap. The window event listeners above
        // catch unhandledrejection + error events, but cornhusk
        // also calls `console.error("cornhusk, shared-service,
        // error:", ...)` directly — those bypass the event path
        // entirely. The bundled installConsoleFilter() wraps
        // console.* too, but cornhusk loads at document_start
        // (before our module bundle) and caches the ORIGINAL
        // console references; subsequent cornhusk calls then
        // hit the original, bypassing our module-level wrap.
        // Wrapping inline here — before any extension can cache
        // the reference — closes that race.
        try {
          function _stringifyArgs(args) {
            var out = '';
            for (var i = 0; i < Math.min(args.length, 6); i += 1) {
              try {
                var a = args[i];
                if (a == null) continue;
                if (typeof a === 'string') out += ' ' + a;
                else if (a instanceof Error) out += ' ' + (a.name || 'Error') + ': ' + (a.message || '');
                else { try { out += ' ' + JSON.stringify(a).slice(0, 256); } catch (e) {} }
              } catch (e) { /* skip arg */ }
              if (out.length > 1024) break;
            }
            return out;
          }
          function _shouldSuppress(args) {
            try {
              var s = _stringifyArgs(args);
              for (var i = 0; i < PATTERNS.length; i += 1) {
                if (s.indexOf(PATTERNS[i]) >= 0) return true;
              }
            } catch (e) { /* never throw */ }
            return false;
          }
          ['error', 'warn'].forEach(function (method) {
            try {
              var orig = console[method];
              if (typeof orig !== 'function') return;
              // Keep the original under a unique key so other code
              // (debuggers, tests) can recover it if needed.
              console['__farroway_orig_inline_' + method] = orig;
              console[method] = function () {
                if (_shouldSuppress(arguments)) return;
                try { return orig.apply(console, arguments); }
                catch (e) { /* swallow — never throw from console */ }
              };
            } catch (e) { /* per-method failure is non-fatal */ }
          });
        } catch (e) { /* never throw from setup */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Service-worker registration is intentionally DISABLED.
      We've been hitting cache-staleness issues where the SW
      keeps farmers on an old shell across deploys. Until the
      Home-banner + sync regressions are resolved, the SW is
      unregistered on every boot via src/lib/forceUiReset.js
      (see killServiceWorkerAndCaches). Re-enabling requires
      removing that call and restoring this <script> tag.
    -->
    <!--
    <script>
      if ('serviceWorker' in navigator && !window.Capacitor) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    -->
    <!-- Defensive in-page cleanup, runs IMMEDIATELY before main.jsx
         loads so the bundle never races a stale SW. The same
         logic also runs from forceUiReset.js for non-web hosts. -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
            }).catch(function () {});
          }
        } catch (e) {}
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (typeof k !== 'string') return;
                var l = k.toLowerCase();
                if (l.indexOf('farroway') >= 0 || l.indexOf('workbox') >= 0) {
                  try { caches.delete(k); } catch (e) {}
                }
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
