# ──────────────────────────────────────────────────────────────
# Railway deployment configuration — SOURCE OF TRUTH
# ──────────────────────────────────────────────────────────────
#
# Build pipeline: DOCKERFILE (NOT nixpacks).
#
# Railway auto-detects the Dockerfile in the repo root and uses
# it as the build source. The `builder = "nixpacks"` setting that
# previously lived here was a no-op — Railway prioritises Dockerfile
# detection over nixpacks config, and the May 2026 audit confirmed
# the live builds were Dockerfile-based despite this file saying
# otherwise. The contradiction was the root cause of an operator
# debugging session: anyone reading railway.toml expected nixpacks
# semantics (auto-installed deps + standard start command) but the
# actual build ran the Dockerfile's RUN steps which install + build
# explicitly. Removed for clarity.
#
# If you want to switch back to nixpacks: DELETE the Dockerfile at
# the repo root AND replace this file's [build] block with:
#     [build]
#     builder = "nixpacks"
#     buildCommand = "npm ci && cd server && npm ci && cd .. && npm run build:safe"
# Don't leave both in place — the deployment-sources guard
# (scripts/ci/check-deployment-sources.mjs) fails the build if
# both a Dockerfile AND a nixpacks builder declaration coexist.
#
# Deploy path: scripts/deploy/deploy-railway.mjs
#   That script is the SINGLE supported entrypoint for production
#   deploys. It auto-fast-forwards local master, writes BUILD_SHA
#   + BUILD_TIMESTAMP files (Dockerfile copies them into the image
#   so /api/health can report the deployed commit), then runs
#   `railway up` and verifies the deployment SHA matches what was
#   uploaded. See docs/ops/DEPLOYMENT_RUNBOOK.md.

[build]
# Empty [build] block intentional — Railway uses the Dockerfile.
# Dockerfile lives at the repo root; see also .dockerignore for
# the build-context filter list.

[deploy]
# `npm start` resolves to:
#   node scripts/prisma-deploy-with-baseline.mjs
#     && cd server && node scripts/init-admin.mjs && node src/server.js
# Non-destructive on every run; safe to restart at any time.
startCommand = "npm start"

# Restart policy: bounded retries so a true crashloop (config bug,
# missing env var) surfaces in Railway's UI instead of silently
# absorbing the failure.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
# Internal container port. Railway maps the public domain to this.
internalPort = 4000
